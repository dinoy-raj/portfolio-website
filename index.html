<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinoy Portfolio</title>
<meta name="description" content="Dinoy, Android developer. Focused Android apps built with Kotlin, Jetpack Compose and Material 3 Expressive.">
<meta name="theme-color" content="#fbf6ee">
<style>*,*::before,*::after{box-sizing:border-box}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="kit/bundle.css">
<style>
/* Expressive Kit, light only. Layout: floating pill nav → poster hero → scroll-lit statement → service rows → apps grid → dark principle cards → notes → contact → dark footer with giant wordmark. */
:root {
  color-scheme: light;
  --surface:#fbf6ee; --surface-container-lowest:#ffffff; --surface-container-low:#f6efe6; --surface-container:#f1e9df;
  --surface-container-high:#ebe2d6; --surface-container-highest:#e4dacd; --on-surface:#1f1a16; --on-surface-variant:#54463d;
  --outline:#85736a; --outline-variant:#d9c7bc;
  --primary:#a8330f; --on-primary:#ffffff; --primary-container:#ffdbcf; --on-primary-container:#3b0900;
  --secondary:#2c6765; --on-secondary:#ffffff; --secondary-container:#bdeeea; --on-secondary-container:#00201f;
  --tertiary:#7a4e8f; --on-tertiary:#ffffff; --tertiary-container:#f3daff; --on-tertiary-container:#2f0a44;
  --highlight:#fc9500; --on-highlight:#2b1700;
  --positive:#1b6d3b; --positive-container:#c3efcf; --on-positive-container:#00210c;
  --error:#ba1a1a; --on-error:#ffffff; --error-container:#ffdad6; --on-error-container:#410002;
  --inverse-surface:#362f2b; --inverse-on-surface:#fbeee8; --inverse-primary:#ffb59c; --inverse-muted:#cdbdb3; --inverse-ghost:#463d38;
  --scrim:rgba(20,12,8,.4); --focus:var(--on-surface);
  --elevation-0:none; --elevation-1:0 1px 2px rgba(31,26,22,.18),0 1px 3px 1px rgba(31,26,22,.08);
  --elevation-3:0 4px 8px 3px rgba(31,26,22,.10),0 1px 3px rgba(31,26,22,.20);
  --font-sans:"Google Sans Flex","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:Fraunces,"Iowan Old Style",Georgia,serif;
  --font-mono:"Google Sans Code","Geist Mono",ui-monospace,Menlo,monospace;
  --font-icons:"Material Symbols Rounded";
  --space-0-5:2px; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --shape-xs:4px; --shape-sm:8px; --shape-md:12px; --shape-lg:16px; --shape-lg-increased:20px; --shape-xl:28px; --shape-xl-increased:32px; --shape-xxl:48px; --shape-full:999px;
  --touch-target:48px; --button-sm:40px; --button-md:56px; --nav-bar:80px; --nav-indicator-w:56px; --fab:56px;
  --state-hover:.08; --state-focus:.1; --state-pressed:.1; --state-disabled:.38;
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.2,0,0,1);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font-sans);font-size:14px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:840px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
section[id]{scroll-margin-top:96px}
.eyebrow{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase}
.muted{color:var(--on-surface-variant)}
.em{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--primary);letter-spacing:-.01em}
.sec-title{font-size:clamp(48px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.045em}
.link-arrow{display:inline-flex;align-items:center;gap:var(--space-2);text-decoration:none;font-weight:600;font-size:15px;border-radius:var(--shape-full);padding:10px 8px 10px 18px;background:var(--surface-container-high)}
.link-arrow .ex-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--on-surface);color:var(--surface);font-size:18px;transition:transform 300ms var(--spring)}
.link-arrow:hover .ex-icon{transform:rotate(45deg)}
.link-arrow:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Floating pill nav that morphs open */
.nav{position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 16px);width:min(360px,calc(100% - 32px));background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:var(--shape-full);padding:8px 8px 8px 20px;box-shadow:var(--elevation-3);transition:border-radius 320ms var(--spring),padding 320ms var(--spring)}
.nav.open{border-radius:var(--shape-xl);padding-bottom:16px}
.nav-row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3)}
.nav-name{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none}
.nav-name .live{width:8px;height:8px;border-radius:50%;background:#7fd9a3;box-shadow:0 0 0 4px rgba(127,217,163,.2)}
.nav .menu-btn{width:44px;height:36px;border-radius:var(--shape-full);background:var(--surface);color:var(--on-surface);display:grid;place-items:center}
.nav.open .menu-btn{border-radius:var(--shape-md)}
.nav-links{display:grid;grid-template-rows:0fr;transition:grid-template-rows 320ms var(--spring)}
.nav.open .nav-links{grid-template-rows:1fr}
.nav-links > div{overflow:hidden;display:flex;flex-direction:column;gap:2px}
.nav-links a{display:flex;justify-content:space-between;align-items:center;padding:12px 12px;border-radius:var(--shape-md);text-decoration:none;font-size:20px;font-weight:600}
.nav-links a:first-child{margin-top:12px}
.nav-links a:hover,.nav-links a:focus-visible{background:var(--inverse-ghost);outline:none}
.nav-links a .ex-icon{font-size:20px;color:var(--inverse-muted)}

/* Hero poster */
.hero{padding-block:calc(env(safe-area-inset-top,0px) + 132px) var(--space-12);position:relative}
.hero h1{font-size:clamp(52px,14.2vw,196px);line-height:.86;font-weight:700;letter-spacing:-.055em;text-transform:uppercase;text-align:center;position:relative}
.hero h1 .l2{display:block}
.hero .float{position:absolute;pointer-events:none}
.hero .f1{left:-1%;top:-14%;width:clamp(56px,9vw,120px)!important;height:clamp(56px,9vw,120px)!important}
.hero .f2{right:-1%;bottom:-22%;width:clamp(52px,8vw,108px)!important;height:clamp(52px,8vw,108px)!important}
.hero .f1 svg,.hero .f2 svg{animation:spin 18s linear infinite}
.hero .f2 svg{animation-duration:12s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.hero-base{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:var(--space-6);margin-top:var(--space-8)}
.hero-base .year{font-size:clamp(36px,5vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1}
.portrait{width:clamp(150px,17vw,210px);aspect-ratio:200/228;border-radius:var(--shape-xxl);background:var(--primary-container);color:var(--on-primary-container);position:relative;overflow:hidden;display:grid;place-items:center;transition:border-radius 400ms var(--spring)}
.portrait:hover{border-radius:50%}
.portrait .ex-shape{position:absolute}
.portrait .initial{position:relative;font-family:var(--font-display);font-style:italic;font-size:88px;font-weight:600;line-height:1}
.portrait .note{position:absolute;bottom:10px;left:0;right:0;text-align:center}
.hero-ctas{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2);justify-self:end;text-align:right}
.hero-ctas .ex-row{justify-content:flex-end}
@media (max-width:720px){
  .hero-base{grid-template-columns:1fr 1fr;grid-template-areas:"p p" "y c"}
  .hero-base .year{grid-area:y}.portrait{grid-area:p;justify-self:center}.hero-ctas{grid-area:c}
}

/* Intro */
.intro{padding-block:var(--space-16)}
.intro h2{font-size:clamp(56px,8vw,104px);line-height:1;font-weight:700;letter-spacing:-.05em;display:flex;align-items:center;gap:.15em}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-8);margin-top:var(--space-12);align-items:end}
.intro-grid .lead{font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.01em;max-width:24ch}
.intro-grid .body{display:flex;flex-direction:column;gap:var(--space-4);max-width:46ch;justify-self:end;font-size:16px;line-height:25px}
@media (max-width:720px){.intro-grid{grid-template-columns:minmax(0,1fr)}.intro-grid .body{justify-self:start}}

/* Scroll-lit statement */
.statement{padding-block:var(--space-16) clamp(96px,14vw,180px)}
.statement p{max-width:24ch;margin:0 auto;text-align:center;font-size:clamp(28px,3.6vw,46px);line-height:1.18;font-weight:600;letter-spacing:-.025em}
.statement .w{color:var(--outline-variant);transition:color 250ms var(--ease)}
.statement .w.on{color:var(--on-surface)}
.statement .w.acc.on{color:var(--primary);font-family:var(--font-display);font-style:italic;font-weight:500}

/* Services */
.services{display:flex;flex-direction:column;gap:var(--space-0-5);margin-top:var(--space-8)}
.svc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-5);padding:var(--space-5) var(--space-6);background:var(--surface-container-low);border-radius:var(--shape-xs);transition:border-radius 300ms var(--spring),background-color 200ms var(--ease)}
.svc:first-child{border-top-left-radius:var(--shape-xl);border-top-right-radius:var(--shape-xl)}
.svc:last-child{border-bottom-left-radius:var(--shape-xl);border-bottom-right-radius:var(--shape-xl)}
.svc:hover{border-radius:var(--shape-xl);background:var(--surface-container-high)}
.svc .ex-shape svg{transition:transform 600ms var(--spring)}
.svc:hover .ex-shape svg{transform:rotate(60deg) scale(1.08)}
.svc h3{font-size:clamp(22px,2.6vw,32px);line-height:1.15;font-weight:600;letter-spacing:-.02em}
.svc .tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.svc .tags span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:var(--shape-full);background:var(--surface);color:var(--on-surface-variant)}
@media (max-width:760px){.svc{grid-template-columns:auto minmax(0,1fr)}.svc .tags{grid-column:1/-1;justify-content:flex-start}}

/* Apps */
.apps{padding-top:clamp(96px,12vw,160px)}
.apps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.apps-head p{max-width:46ch;margin-top:var(--space-4);font-size:16px;line-height:25px}
.apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-12) var(--space-4);margin-top:var(--space-8)}
@media (max-width:760px){.apps-grid{grid-template-columns:minmax(0,1fr)}}
.app{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.app.featured{grid-column:1/-1}
.app .media{position:relative;aspect-ratio:16/11;border-radius:var(--shape-xxl);overflow:hidden;display:flex;justify-content:center;align-items:flex-start;transition:border-radius 400ms var(--spring)}
.app.featured .media{aspect-ratio:2/1}
@media (max-width:760px){.app.featured .media{aspect-ratio:1/1}.app.featured .shots{gap:var(--space-2);padding-top:8%}}
.app:hover .media{border-radius:var(--shape-xl)}
.shots{position:relative;display:flex;justify-content:center;align-items:flex-start;width:100%;padding-top:9%;transition:transform 450ms var(--spring)}
.app:hover .shots{transform:translateY(-3%)}
.shots img{display:block;width:31%;height:auto;border-radius:clamp(12px,2vw,22px);box-shadow:var(--elevation-3);background:var(--surface-container);flex:none}
.shots img:nth-child(1){transform:translate(18%,10%) rotate(-6deg)}
.shots img:nth-child(2){position:relative;z-index:1}
.shots img:nth-child(3){transform:translate(-18%,10%) rotate(6deg)}
.app.featured .shots{gap:var(--space-4);padding-top:6%}
.app.featured .shots img{width:min(19%,190px);transform:none}
.app.featured .shots img:nth-child(odd){transform:translateY(12%)}
@media (max-width:760px){.app.featured .shots img{width:30%}.app.featured .shots img:nth-child(4){display:none}}
.app-meta{display:flex;align-items:center;gap:var(--space-3);padding-inline:var(--space-1)}
.app-meta .icon{width:56px;height:56px;border-radius:var(--shape-lg);flex:none;box-shadow:var(--elevation-1)}
.app-meta .name{flex:1;min-width:0}
.app h3{font-size:28px;line-height:32px;font-weight:600;letter-spacing:-.025em}
.app-meta .store{font-size:14px;margin-top:2px}
.app .tags .chip{font-family:var(--font-mono);font-size:11px;letter-spacing:.8px;text-transform:uppercase;display:inline-flex;align-items:center}
@media (max-width:760px){.app h3{font-size:24px;line-height:28px}}
.app .tags .chip.live{background:var(--positive-container);color:var(--on-positive-container)}
.app .tags .chip.wip{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.app .desc{font-size:16px;line-height:25px;max-width:60ch;padding-inline:var(--space-1)}
.app .tags{display:flex;flex-wrap:wrap;gap:6px;padding-inline:var(--space-1)}
.app .tags span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:var(--shape-full);background:var(--surface-container-low);color:var(--on-surface-variant)}
.app .links{display:flex;flex-wrap:wrap;gap:var(--space-2);padding-inline:var(--space-1)}
.app .links .link-arrow{font-size:14px;padding:6px 6px 6px 16px}
.app .links .link-arrow .ex-icon{width:28px;height:28px;font-size:16px}

/* How I work: dark cards */
.how{padding-top:clamp(96px,12vw,160px)}
.how-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3);margin-top:var(--space-8)}
@media (max-width:1000px){.how-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.how-grid{grid-template-columns:minmax(0,1fr)}}
.how-card{background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:var(--shape-xl);padding:var(--space-6);min-height:300px;display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-8);transition:border-radius 300ms var(--spring),transform 300ms var(--spring)}
.how-card:hover{border-radius:var(--shape-xxl);transform:translateY(-4px)}
.how-card p{font-size:19px;line-height:27px;letter-spacing:-.01em}
.how-card .foot{display:flex;align-items:center;gap:var(--space-3)}
.how-card .foot b{display:block;font-size:15px;font-weight:600}
.how-card .foot span{font-size:13px;color:var(--inverse-muted)}

/* Notes */
.notes{padding-top:clamp(96px,12vw,160px)}
.notes-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-3);margin-top:var(--space-8)}
@media (max-width:900px){.notes-grid{grid-template-columns:minmax(0,1fr)}}
.note{position:relative;min-height:380px;border-radius:var(--shape-xl);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:var(--space-6);gap:var(--space-2);text-decoration:none;color:inherit;transition:border-radius 300ms var(--spring)}
.note:hover{border-radius:var(--shape-xxl)}
.note:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.note .art{position:absolute;inset:0 0 150px;display:grid;place-items:center}
.note .art .ex-shape{position:absolute}
.note .txt{position:relative;display:flex;flex-direction:column;gap:var(--space-2);background:var(--surface);border-radius:var(--shape-lg-increased);padding:var(--space-4) var(--space-5)}
.note h3{font-size:24px;line-height:29px;font-weight:600;letter-spacing:-.02em}
.note.dark{background:var(--inverse-surface);color:var(--inverse-on-surface);justify-content:space-between}
.note.dark h3{font-size:clamp(30px,3vw,38px);line-height:1.12;letter-spacing:-.025em;font-weight:600}
.note.dark .link-arrow{background:var(--inverse-ghost);align-self:flex-start}
.note.dark .link-arrow .ex-icon{background:var(--inverse-on-surface);color:var(--inverse-surface)}

/* Contact */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-8);padding-block:clamp(96px,12vw,160px)}
@media (max-width:820px){.contact{grid-template-columns:minmax(0,1fr)}}
.contact .left{display:flex;flex-direction:column;justify-content:space-between;gap:var(--space-8)}
.contact .left p{font-size:17px;line-height:26px;max-width:40ch;margin-top:var(--space-4)}
.socials{display:flex;gap:var(--space-2);flex-wrap:wrap}
.form-card{background:var(--primary-container);color:var(--on-primary-container);border-radius:var(--shape-xl);padding:var(--space-6);display:flex;flex-direction:column;gap:var(--space-4);--field-ground:var(--primary-container)}
.form-card .ex-field-label{color:var(--on-primary-container)}
.mail-row{display:inline-flex;align-items:center;gap:var(--space-2);background:var(--surface-container-high);border-radius:var(--shape-full);padding:4px 4px 4px 18px;max-width:100%;align-self:flex-start}
.mail-row .addr{font-family:var(--font-mono);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* Footer */
.footer{background:var(--inverse-surface);color:var(--inverse-on-surface);border-radius:var(--shape-xxl) var(--shape-xxl) 0 0;overflow:hidden}
.footer .wrap{padding-block:var(--space-16) 0}
.foot-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,.8fr);gap:var(--space-8)}
@media (max-width:820px){.foot-grid{grid-template-columns:minmax(0,1fr)}}
.foot-grid h2{font-size:clamp(40px,5vw,64px);line-height:1;font-weight:700;letter-spacing:-.045em}
.foot-grid h2 .em{color:var(--inverse-primary)}
.foot-grid h4{margin:0 0 var(--space-4);font-size:20px;font-weight:600}
.foot-links{display:flex;flex-wrap:wrap;gap:var(--space-2)}
.foot-links a{text-decoration:none;background:var(--surface);color:var(--on-surface);padding:8px 16px;border-radius:var(--shape-full);font-weight:600;font-size:14px;transition:border-radius 220ms var(--ease)}
.foot-links a:active{border-radius:var(--shape-md)}
.foot-links a:focus-visible{outline:2px solid var(--inverse-on-surface);outline-offset:2px}
.wordmark{font-size:clamp(96px,27vw,380px);line-height:.74;font-weight:700;letter-spacing:-.06em;color:var(--inverse-ghost);text-align:center;margin-top:var(--space-12);user-select:none;white-space:nowrap}
.fine{display:flex;justify-content:space-between;gap:var(--space-3);flex-wrap:wrap;padding-block:var(--space-5) calc(var(--space-5) + env(safe-area-inset-bottom,0px));color:var(--inverse-muted);font-size:13px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px));z-index:40;width:min(420px,calc(100% - 32px));animation:rise 420ms var(--spring) both}
@keyframes rise{from{transform:translate(-50%,12px)}to{transform:translate(-50%,0)}}
@media (prefers-reduced-motion: reduce){.hero .f1 svg,.hero .f2 svg,.toast{animation:none}}
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script src="kit/bundle.js"></script>
<script>
(function () {
  const { useState, useEffect, useRef } = React;
  const html = htm.bind(React.createElement);
  const E = window.Expressive;
  const NAME = 'Dinoy';
  const EMAIL = 'hello@yourdomain.com';

  const SERVICES = [
    { name: 'Android Apps', shape: 'cookie9', icon: 'android', tone: 'primary-container', tags: ['Kotlin', 'Jetpack Compose', 'Play Store release'] },
    { name: 'App Redesigns', shape: 'flower5', icon: 'auto_awesome', tone: 'tertiary-container', tags: ['Material 3 Expressive', 'Dark theme', 'Motion'] },
    { name: 'Design Systems', shape: 'clover4', icon: 'category', tone: 'secondary-container', tags: ['Tokens', 'Components', 'Guidelines'] },
    { name: 'Icons & Visuals', shape: 'burst', icon: 'interests', tone: 'highlight', tags: ['App icons', 'Icon sets', 'Store graphics'] },
  ];

  // Real apps, with copy from each app's README / Play Store listing and its own store screenshots (assets/apps).
  const PLAY = id => 'https://play.google.com/store/apps/details?id=' + id;
  const APPS = [
    { id: 'launcher', name: 'Dino Minimalist Launcher', store: 'Minimalist launcher for Android', featured: true, status: 'live', bg: '#efe6d8',
      desc: 'A minimalist Android launcher designed to help you reduce screen time and boost focus. A clean, text-based home screen with only the apps you pin, custom themes and palettes, fonts, layouts and widgets, and no ads. Several of the apps below began as tools inside it.',
      tags: ['Launcher', 'Material You', 'Custom themes', 'Widgets'],
      shots: ['Dark theme', 'Sand theme', 'Light theme', 'Red theme'],

  const HOW = [
    { text: 'One hero per screen. I decide the single thing each screen exists to show, then make everything else quieter.', title: 'Hierarchy first', sub: 'Before any pixels', shape: 'sunny', icon: 'filter_1', tone: 'highlight' },
    { text: 'Light and dark from day one, tested at 4.5:1. Dark mode is designed, never inverted.', title: 'Both themes', sub: 'Accessible by default', shape: 'cookie6', icon: 'contrast', tone: 'primary-container' },
    { text: 'Buttons that morph when pressed, springs that overshoot a little. Motion that tells you something happened.', title: 'Expressive motion', sub: 'Feel, not decoration', shape: 'flower5', icon: 'animation', tone: 'tertiary-container' },
    { text: 'Every app starts from my own kit of tokens and components, so it ships faster and stays consistent.', title: 'Built on a system', sub: '22 components and counting', shape: 'clover4', icon: 'widgets', tone: 'secondary-container' },

  const STATEMENT = 'From idea to Play Store. Small, focused apps that feel *alive* when you touch them, built with clear hierarchy, honest colour and springy motion.';

  function Nav() {
    const [open, setOpen] = useState(false);
    useEffect(() => { const k = e => { if (e.key === 'Escape') setOpen(false); }; addEventListener('keydown', k); return () => removeEventListener('keydown', k); }, []);
    const links = [['Apps', '#apps'], ['Services', '#services'], ['How I work', '#how'], ['Contact', '#contact']];
    return html`<nav class=${'nav' + (open ? ' open' : '')} aria-label="Main">
      <div class="nav-row">
        <a class="nav-name" href="#top"><span class="live" aria-hidden="true"></span>${NAME}</a>
        <button type="button" class="ex-press menu-btn" aria-expanded=${open} aria-controls="nav-links" aria-label=${open ? 'Close menu' : 'Open menu'} onClick=${() => setOpen(!open)}>
          <span class="ex-icon">${open ? 'close' : 'more_horiz'}</span></button>
      </div>
      <div class="nav-links" id="nav-links"><div>
        ${links.map(([l, h]) => html`<a key=${h} href=${h} tabindex=${open ? 0 : -1} onClick=${() => setOpen(false)}>${l}<span class="ex-icon">arrow_outward</span></a>`)}
      </div></div>
    </nav>`;
  }

  function Statement() {
    const ref = useRef(null);
    const words = STATEMENT.split(' ').map(w => ({ acc: w.startsWith('*'), t: w.replace(/\*/g, '') }));
    const [lit, setLit] = useState(words.length);
    useEffect(() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let raf = 0;
      const calc = () => {
        raf = 0; const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect(), vh = innerHeight;
        const p = Math.min(1, Math.max(0, (vh * 0.85 - r.top) / (r.height + vh * 0.35)));
        setLit(Math.max(1, Math.round(p * words.length)));
      };
      const on = () => { if (!raf) raf = requestAnimationFrame(calc); };
      calc(); addEventListener('scroll', on, { passive: true }); addEventListener('resize', on);
      return () => { removeEventListener('scroll', on); removeEventListener('resize', on); };
    }, []);
    return html`<section class="statement wrap" aria-label="Statement"><p ref=${ref} aria-label=${STATEMENT.replace(/\*/g, '')}>
      ${words.map((w, i) => html`<span key=${i} aria-hidden="true" class=${'w' + (w.acc ? ' acc' : '') + (i < lit ? ' on' : '')}>${w.t}${' '}</span>`)}
    </p></section>`;
  }

    const [msg, setMsg] = useState(null);
    useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(null), 3400); return () => clearTimeout(t); }, [msg]);

    const submit = e => { e.preventDefault(); setMsg('This form is a preview. Connect it to your inbox to receive messages.'); };

    return html`<${React.Fragment}>

            <${E.ShapeAvatar} className="float f2" shape="burst" tone="primary" size=${108} />
          </h1>
          <div class="hero-base">
            <div class="year">©2026</div>
            <div class="portrait" role="img" aria-label="Portrait placeholder">

              <div class="ex-row">

              </div>
              <span class="eyebrow muted">/ Shipping calm apps</span>
            </div>
          </div>
        </section>

        <section class="intro wrap" id="about">
          <h2>Hey! <${E.ShapeAvatar} shape="cookie12" tone="tertiary-container" icon="waving_hand" size=${84} /></h2>
          <div class="intro-grid">
            <p class="lead">I'm ${NAME}, an Android developer who designs the apps <span class="em">before</span> building them.</p>
            <div class="body muted">
              <p>I build focused Android apps in Kotlin and Jetpack Compose: timers, habit trackers, link managers, and blockers for the feeds that eat your evening.</p>
              <p>Every project starts from Expressive Kit, my own Material 3 Expressive design system, so the shapes, colours and motion stay consistent from the first screen to the last.</p>
              <a class="link-arrow" href="#contact" style=${{ alignSelf: 'flex-start', marginTop: '8px' }}>Get started<span class="ex-icon">arrow_outward</span></a>
            </div>

        <${Statement} />

        <section class="wrap" id="services">
          <h2 class="sec-title">Services</h2>
          <div class="services">
            ${SERVICES.map(s => html`<div class="svc" key=${s.name}>
              <${E.ShapeAvatar} shape=${s.shape} icon=${s.icon} tone=${s.tone} size=${52} />
              <h3>${s.name}</h3>
              <div class="tags">${s.tags.map(t => html`<span key=${t}>${t}</span>`)}</div>
            </div>`)}
          </div>
        </section>

        <section class="apps wrap" id="apps">
          <div class="apps-head">
            <div>
              <h2 class="sec-title">My<br/>Apps</h2>
              <p class="muted">Android apps I design and build end to end in Kotlin and Jetpack Compose. Screenshots are the apps' own store screens.</p>
            </div>
            <a class="link-arrow" href="https://github.com/dinoy-raj" target="_blank" rel="noopener">More on GitHub<span class="ex-icon">arrow_outward</span></a>
          </div>

            ${APPS.map(a => html`<article class=${'app' + (a.featured ? ' featured' : '')} key=${a.id} aria-labelledby=${'app-' + a.id}>

              </div>
              <div class="app-meta">
                <img class="icon" src=${'assets/apps/' + a.id + '-icon.webp'} alt="" width="56" height="56" loading="lazy" />
                <div class="name"><h3 id=${'app-' + a.id}>${a.name}</h3><div class="store muted">${a.store}</div></div>
              </div>
              <p class="desc muted">${a.desc}</p>
              <div class="tags">${a.status && html`<span class=${'chip ' + a.status}>${a.status === 'live' ? 'On Google Play' : 'In development'}</span>`}${a.tags.map(t => html`<span key=${t}>${t}</span>`)}</div>

        <section class="how wrap" id="how">

            </article>`)}
          </div>
        </section>

        <section class="notes wrap" id="notes">
          <h2 class="sec-title">Notes</h2>

            <a class="note bg-p" href="#notes" onClick=${e => { e.preventDefault(); setMsg('Link this note to your blog post'); }}>
              <div class="art" aria-hidden="true">
                <${E.ShapeAvatar} shape="cookie9" tone="primary" size=${230} spin=${true} />
                <span style=${{ position: 'relative', fontSize: '56px', fontWeight: 700, color: 'var(--on-primary)', letterSpacing: '-2px' }}>25:00</span>
              </div>
              <div class="txt"><span class="eyebrow muted">Case note · Focus</span><h3>Designing a timer around one number</h3><p class="muted">Why the countdown is the only loud thing on the screen.</p></div>
            </a>
            <a class="note bg-s" href="#notes" onClick=${e => { e.preventDefault(); setMsg('Link this note to your blog post'); }}>
              <div class="art" aria-hidden="true">
                <${E.ShapeAvatar} shape="clover4" tone="secondary" size=${160} style=${{}} />
                <${E.ShapeAvatar} shape="flower5" tone="highlight" size=${90} />
              </div>
              <div class="txt"><span class="eyebrow muted">Design system</span><h3>Distilling M3 Expressive into a kit</h3><p class="muted">What I kept from 100 reference screens, and what I dropped.</p></div>
            </a>
            <div class="note dark">
              <h3>Notes on building small apps, one screen at a time.</h3>
              <a class="link-arrow" href="#notes" onClick=${e => { e.preventDefault(); setMsg('Link your blog here'); }}>Read all notes<span class="ex-icon">arrow_outward</span></a>

            </div>
            <div class="socials">
              <${E.IconButton} icon="code" label="GitHub" variant="tonal" onClick=${() => setMsg('Add your GitHub link')} />

              <${E.IconButton} icon="shop" label="Google Play" variant="tonal" onClick=${() => setMsg('Add your Play Store developer page')} />
              <${E.IconButton} icon="photo_camera" label="Instagram" variant="tonal" onClick=${() => setMsg('Add your Instagram link')} />
            </div>
          </div>
          <form class="form-card" onSubmit=${submit}>
            <div class="eyebrow">New project</div>
            <${E.TextField} id="c-name" label="Name" placeholder="Enter your name" />
            <${E.TextField} id="c-email" label="Email" placeholder="Enter your email" inputMode="email" />
            <${E.TextField} id="c-project" label="Your project" multiline=${true} placeholder="Tell me about your app" />
            <div class="ex-row">${['Android app', 'Redesign', 'Design system', 'Icons'].map(t => html`<${E.Chip} key=${t} label=${t} />`)}</div>
            <button type="submit" class="ex-press ex-btn v-filled size-md full">Send message</button>

        </section>
      </main>

      <footer class="footer">
        <div class="wrap">
          <div class="foot-grid">
            <h2>Small apps,<br/><span class="em">finished</span> properly.</h2>
            <div><h4>/ Quick links</h4><div class="foot-links">
              ${[['Home', '#top'], ['About', '#about'], ['Services', '#services'], ['Apps', '#apps'], ['Contact', '#contact']].map(([l, h]) => html`<a key=${h} href=${h}>${l}</a>`)}
            </div></div>
            <div><h4>/ Contact</h4><div style=${{ fontFamily: 'var(--font-mono)', fontSize: '14px', wordBreak: 'break-all' }}>${EMAIL}</div></div>
          </div>

      ${msg && html`<div class="toast"><${E.Snackbar} message=${msg} action="OK" onAction=${() => setMsg(null)} /></div>`}

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
