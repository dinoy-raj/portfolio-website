<!-- Fraunces and the code font swap in. Google Sans Flex blocks so the hero heading never reflows; the icon font blocks so ligature names never flash. Add any new icon to icon_names (alphabetical). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Google+Sans+Code:wght@400;500&display=swap">

<style>
/* Expressive Kit, light only. Layout: floating pill nav → poster hero → scroll-lit statement → service rows → apps grid → talks accordion + event tickets → blogs → contact → dark footer with giant wordmark. */
:root {
  color-scheme: light;
  --surface:#fbf6ee; --surface-container-lowest:#ffffff; --surface-container-low:#f6efe6; --surface-container:#f1e9df;
  --surface-container-high:#ebe2d6; --surface-container-highest:#e4dacd; --on-surface:#1f1a16; --on-surface-variant:#54463d;
  --outline:#85736a; --outline-variant:#d9c7bc;
  --primary:#a8330f; --on-primary:#ffffff; --primary-container:#ffdbcf; --on-primary-container:#3b0900;
  --secondary:#2c6765; --on-secondary:#ffffff; --secondary-container:#bdeeea; --on-secondary-container:#00201f;
  --tertiary:#7a4e8f; --on-tertiary:#ffffff; --tertiary-container:#f3daff; --on-tertiary-container:#2f0a44;
  --highlight:#fc9500; --on-highlight:#2b1700;
  --positive:#1b6d3b; --positive-container:#c3efcf; --on-positive-container:#00210c;
  --error:#ba1a1a; --on-error:#ffffff; --error-container:#ffdad6; --on-error-container:#410002;
  --inverse-surface:#362f2b; --inverse-on-surface:#fbeee8; --inverse-primary:#ffb59c; --inverse-muted:#cdbdb3; --inverse-ghost:#463d38;
  --scrim:rgba(20,12,8,.4); --focus:var(--on-surface);
  --elevation-0:none; --elevation-1:0 1px 2px rgba(31,26,22,.18),0 1px 3px 1px rgba(31,26,22,.08);
  --elevation-3:0 4px 8px 3px rgba(31,26,22,.10),0 1px 3px rgba(31,26,22,.20);
  --font-sans:"Google Sans Flex","Google Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-display:Fraunces,"Iowan Old Style",Georgia,serif;
  --font-mono:"Google Sans Code","Geist Mono",ui-monospace,Menlo,monospace;
  --font-icons:"Material Symbols Rounded";
  --space-0-5:2px; --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --shape-xs:4px; --shape-sm:8px; --shape-md:12px; --shape-lg:16px; --shape-lg-increased:20px; --shape-xl:28px; --shape-xl-increased:32px; --shape-xxl:48px; --shape-full:999px;
  --touch-target:48px; --button-sm:40px; --button-md:56px; --nav-bar:80px; --nav-indicator-w:56px; --fab:56px;
  --state-hover:.08; --state-focus:.1; --state-pressed:.1; --state-disabled:.38;
  --spring:cubic-bezier(.34,1.4,.64,1); --ease:cubic-bezier(.2,0,0,1);
}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{background:var(--surface);color:var(--on-surface);font-family:var(--font-sans);font-size:14px;overflow-x:clip}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,p{margin:0;text-wrap:balance}
p{text-wrap:pretty}
a{color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:840px){.wrap{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
section[id]{scroll-margin-top:96px}
.eyebrow{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase}
.muted{color:var(--on-surface-variant)}
.em{font-family:var(--font-display);font-style:italic;font-weight:500;color:var(--primary);letter-spacing:-.01em}
.sec-title{font-size:clamp(48px,7vw,88px);line-height:1;font-weight:700;letter-spacing:-.045em}
.link-arrow{display:inline-flex;align-items:center;gap:var(--space-2);text-decoration:none;font-weight:600;font-size:15px;border-radius:var(--shape-full);padding:10px 8px 10px 18px;background:var(--surface-container-high)}
.link-arrow .ex-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--on-surface);color:var(--surface);font-size:18px;transition:transform 300ms var(--spring)}
.link-arrow:hover .ex-icon{transform:rotate(45deg)}
.link-arrow:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* Header island: dark rounded bar, name left, M3E cookie button right. Opens by growing in place. */
.nav{--island:#141110;--island-ink:#fbf6ee;--island-muted:#b8aaa1;--island-hover:#2a2420;--island-line:#2f2925;
  position:fixed;z-index:25;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 20px);
  width:min(320px,calc(100% - 32px));height:60px;overflow:hidden;background:var(--island);color:var(--island-ink);border-radius:16px;
  box-shadow:0 1px 2px rgba(20,12,8,.25),0 8px 24px -8px rgba(20,12,8,.35);
  transition:height 360ms cubic-bezier(.3,0,.2,1),width 360ms cubic-bezier(.3,0,.2,1),border-radius 300ms cubic-bezier(.3,0,.2,1)}
.nav.open{width:min(400px,calc(100% - 32px));border-radius:28px;
  transition:height 560ms cubic-bezier(.3,1.25,.45,1),width 560ms cubic-bezier(.3,1.25,.45,1),border-radius 420ms cubic-bezier(.2,0,0,1)}
.nav-row{height:60px;display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);padding:0 10px 0 16px}
.nav-name{font-weight:700;font-size:20px;letter-spacing:-.02em;text-decoration:none;border-radius:6px}
.nav-name:focus-visible{outline:2px solid var(--island-ink);outline-offset:4px}
.menu-btn{position:relative;width:44px;height:44px;display:grid;place-items:center;background:none;border:0;padding:0;cursor:pointer;color:var(--on-surface);-webkit-tap-highlight-color:transparent;border-radius:50%}
.menu-btn svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.menu-btn svg path{fill:var(--surface);transition:fill 200ms var(--ease)}
.menu-btn:hover svg path{fill:#ffffff}
.menu-btn:focus-visible{outline:2px solid var(--island-ink);outline-offset:3px}
.menu-btn .ex-icon{position:absolute;font-size:22px;transition:opacity 180ms var(--ease),transform 420ms var(--spring)}
.menu-btn .i-close{opacity:0;transform:rotate(-90deg) scale(.6)}
.nav.open .menu-btn .i-more{opacity:0;transform:rotate(90deg) scale(.6)}
.nav.open .menu-btn .i-close{opacity:1;transform:none}
.nav-panel{padding:4px 10px 10px}
.nav-panel nav{display:flex;flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid var(--island-line)}
.nav-panel a.lnk{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px;padding:0 8px 0 10px;border-radius:14px;text-decoration:none;font-size:22px;font-weight:600;letter-spacing:-.02em;transition:background-color 160ms var(--ease),border-radius 260ms var(--spring)}
.nav-panel a.lnk .go{width:34px;height:34px;display:grid;place-items:center;position:relative;color:var(--island-muted);transition:color 160ms var(--ease)}
.nav-panel a.lnk .go svg{position:absolute;inset:0;width:100%;height:100%;transform:scale(.4) rotate(0deg);opacity:0;transition:transform 420ms var(--spring),opacity 160ms var(--ease)}
.nav-panel a.lnk .go svg path{fill:var(--primary-container)}
.nav-panel a.lnk .go .ex-icon{position:relative;font-size:20px}
.nav-panel a.lnk:hover,.nav-panel a.lnk:focus-visible{background:var(--island-hover);border-radius:22px;outline:none}
.nav-panel a.lnk:hover .go,.nav-panel a.lnk:focus-visible .go{color:var(--on-primary-container)}
.nav-panel a.lnk:hover .go svg,.nav-panel a.lnk:focus-visible .go svg{transform:scale(1) rotate(45deg);opacity:1}
.nav-panel .num{font-family:var(--font-mono);font-size:11px;color:var(--island-muted);margin-right:12px;letter-spacing:.5px}
.nav-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;padding:12px 8px 2px 10px;border-top:1px solid var(--island-line)}
.nav-foot .status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--island-muted)}
.nav-foot .status i{width:8px;height:8px;border-radius:50%;background:#7fd9a3;box-shadow:0 0 0 4px rgba(127,217,163,.18)}
.nav-foot a{background:var(--island-ink);color:var(--island);text-decoration:none;font-weight:600;font-size:14px;height:40px;padding:0 18px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;transition:border-radius 220ms var(--ease)}
.nav-foot a:active{border-radius:12px}
.nav-foot a:focus-visible{outline:2px solid var(--island-ink);outline-offset:3px}
/* staggered reveal: each item rises and fades in after the island has started growing; closing hides them at once */
.nav-panel .rv{opacity:0;transform:translateY(-10px) scale(.98);transition:opacity 120ms var(--ease),transform 120ms var(--ease)}
.nav.open .nav-panel .rv{opacity:1;transform:none;transition:opacity 260ms var(--ease) calc(110ms + var(--i)*45ms),transform 520ms var(--spring) calc(110ms + var(--i)*45ms)}
.nav-scrim{position:fixed;inset:0;z-index:24;background:rgba(20,12,8,.22);opacity:0;pointer-events:none;transition:opacity 280ms var(--ease)}
.nav-scrim.on{opacity:1;pointer-events:auto}
/* Progressive blur under the nav: stacked backdrop blurs, each masked to a lower band, so content softens more the closer it gets to the top. Fades in once the page scrolls. */
.top-blur{position:fixed;inset:0 0 auto;height:calc(env(safe-area-inset-top,0px) + 168px);z-index:23;pointer-events:none;opacity:0;transition:opacity 320ms var(--ease)}
.top-blur.on{opacity:1}
.top-blur i{position:absolute;inset:0}
/* Six stacked bands, each twice the blur of the one below, so it deepens smoothly toward the top edge. */
.top-blur i:nth-child(1){backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);mask:linear-gradient(to top,transparent 0%,#000 17%,transparent 33%);-webkit-mask:linear-gradient(to top,transparent 0%,#000 17%,transparent 33%)}
.top-blur i:nth-child(2){backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);mask:linear-gradient(to top,transparent 0%,#000 17%,#000 33%,transparent 50%);-webkit-mask:linear-gradient(to top,transparent 0%,#000 17%,#000 33%,transparent 50%)}
.top-blur i:nth-child(3){backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);mask:linear-gradient(to top,transparent 17%,#000 33%,#000 50%,transparent 67%);-webkit-mask:linear-gradient(to top,transparent 17%,#000 33%,#000 50%,transparent 67%)}
.top-blur i:nth-child(4){backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);mask:linear-gradient(to top,transparent 33%,#000 50%,#000 67%,transparent 83%);-webkit-mask:linear-gradient(to top,transparent 33%,#000 50%,#000 67%,transparent 83%)}
.top-blur i:nth-child(5){backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);mask:linear-gradient(to top,transparent 50%,#000 67%,#000 83%,transparent 100%);-webkit-mask:linear-gradient(to top,transparent 50%,#000 67%,#000 83%,transparent 100%)}
.top-blur i:nth-child(6){backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);mask:linear-gradient(to top,transparent 67%,#000 83%);-webkit-mask:linear-gradient(to top,transparent 67%,#000 83%)}
.top-blur::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,color-mix(in srgb,var(--surface) 86%,transparent),color-mix(in srgb,var(--surface) 40%,transparent) 45%,transparent)}
@media (prefers-reduced-motion: reduce){.nav,.nav.open,.nav-panel .rv,.nav.open .nav-panel .rv{transition-duration:0ms!important;transition-delay:0ms!important}}

/* Hero poster */
.hero{padding-block:calc(env(safe-area-inset-top,0px) + 132px) var(--space-12);position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.hero h1{font-size:clamp(52px,14.2vw,196px);line-height:.86;font-weight:700;letter-spacing:-.055em;text-transform:uppercase;text-align:center;position:relative}
.hero h1 .l1,.hero h1 .l2{display:block;white-space:nowrap}
/* Letter becomes shape: the O turns into a ring that stretches into a pill, squares off, then snaps back.
   The rest of the word narrows (font-stretch drives the wdth axis) so the line keeps its width. */
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.sw{animation:sw-squash 12.8s var(--ease) infinite;animation-delay:var(--d,0s)}
.glyph-o{display:inline-block;box-sizing:border-box;width:.78em;height:.72em;border:.13em solid currentColor;border-radius:999px;margin:0 .015em -.012em .005em;vertical-align:baseline;animation:sw-o 12.8s var(--ease) infinite;animation-delay:var(--d,0s)}
@keyframes sw-squash{0%,30%,62%,100%{font-stretch:100%}40%,54%{font-stretch:64%}}
@keyframes sw-o{
  0%,30%{width:.78em;border-radius:999px;border-color:currentColor;transform:rotate(0)}
  40%,54%{width:var(--pill,2.2em);border-radius:999px;border-color:var(--primary);transform:rotate(0)}
  64%,72%{width:.72em;border-radius:.22em;border-color:var(--primary);transform:rotate(90deg)}
  84%,100%{width:.78em;border-radius:999px;border-color:currentColor;transform:rotate(180deg)}
}
@media (prefers-reduced-motion: reduce){.sw,.glyph-o{animation:none}}
.hero .float{position:absolute;pointer-events:none}
.hero .f1{left:-1%;top:-14%;width:clamp(56px,9vw,120px);height:clamp(56px,9vw,120px)}
.hero .f2{right:-1%;bottom:-22%;width:clamp(52px,8vw,108px);height:clamp(52px,8vw,108px)}
.morph{display:block}
.morph svg{width:100%;height:100%;overflow:visible;display:block}
.hero-base{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:var(--space-6);margin-top:auto;padding-top:var(--space-8)}
.hero-base .year{font-size:clamp(36px,5vw,64px);font-weight:700;letter-spacing:-.04em;line-height:1}
.portrait{width:clamp(150px,17vw,210px);aspect-ratio:200/228;position:relative;isolation:isolate}
.portrait .halo{position:absolute;z-index:-1;right:-26%;top:-20%;width:78%!important;height:auto!important;aspect-ratio:1}
.portrait .spark{position:absolute;z-index:2;left:-14%;bottom:12%;width:30%!important;height:auto!important;aspect-ratio:1}
.portrait .frame{position:absolute;inset:0;border-radius:var(--shape-xxl);overflow:hidden;background:#0d0b0a;box-shadow:0 18px 40px -18px rgb(59 9 0 / .55);transition:border-radius 400ms var(--spring)}
.portrait:hover .frame{border-radius:50%}
.portrait img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 30%;transition:transform 600ms var(--spring)}
.portrait:hover img{transform:scale(1.06)}
.portrait .frame::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgb(168 51 15 / .55),transparent 42%);mix-blend-mode:multiply;pointer-events:none}
.portrait .note{position:absolute;z-index:1;bottom:10px;left:0;right:0;text-align:center;color:#fff}
.hero-ctas{display:flex;flex-direction:column;align-items:flex-end;gap:var(--space-2);justify-self:end;text-align:right}
.hero-ctas .ex-row{justify-content:flex-end}
@media (max-width:720px){
  .hero-base{grid-template-columns:1fr 1fr;grid-template-areas:"p p" "y c"}
  .hero-base .year{grid-area:y}.portrait{grid-area:p;justify-self:center}.hero-ctas{grid-area:c}
  .portrait .note{display:none}
  .hero{justify-content:center}.hero-base{margin-top:0}
}

/* Intro */
.intro{padding-block:var(--space-16)}
.intro h2{font-size:clamp(56px,8vw,104px);line-height:1;font-weight:700;letter-spacing:-.05em;display:flex;align-items:center;gap:.15em}
.intro-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--space-8);margin-top:var(--space-12);align-items:end}
.intro-grid .lead{font-size:22px;line-height:30px;font-weight:600;letter-spacing:-.01em;max-width:24ch}
.intro-grid .body{display:flex;flex-direction:column;gap:var(--space-4);max-width:46ch;justify-self:end;font-size:16px;line-height:25px}
@media (max-width:720px){.intro-grid{grid-template-columns:minmax(0,1fr)}.intro-grid .body{justify-self:start}}

/* Scroll-lit statement */
.statement{padding-block:var(--space-16) clamp(96px,14vw,180px)}
.statement p{max-width:24ch;margin:0 auto;text-align:center;font-size:clamp(28px,3.6vw,46px);line-height:1.18;font-weight:600;letter-spacing:-.025em}
.statement .w{color:var(--outline);transition:color 250ms var(--ease)}
.statement .w.on{color:var(--on-surface)}
.statement .w.hl.on{color:var(--primary);font-family:var(--font-display);font-style:italic;font-weight:500}

/* Services */
.services{display:flex;flex-direction:column;gap:var(--space-0-5);margin-top:var(--space-8)}
.svc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-5);padding:var(--space-5) var(--space-6);background:var(--surface-container-low);border-radius:var(--shape-xs);transition:border-radius 300ms var(--spring),background-color 200ms var(--ease)}
.svc:first-child{border-top-left-radius:var(--shape-xl);border-top-right-radius:var(--shape-xl)}
.svc:last-child{border-bottom-left-radius:var(--shape-xl);border-bottom-right-radius:var(--shape-xl)}
.svc:hover{border-radius:var(--shape-xl);background:var(--surface-container-high)}
.svc .ex-shape svg{transition:transform 600ms var(--spring)}
.svc:hover .ex-shape svg{transform:rotate(60deg) scale(1.08)}
.svc h3{font-size:clamp(22px,2.6vw,32px);line-height:1.15;font-weight:600;letter-spacing:-.02em}
.svc .tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.svc .tags span{font-size:13px;font-weight:500;padding:6px 12px;border-radius:var(--shape-full);background:var(--surface);color:var(--on-surface-variant)}
@media (max-width:760px){.svc{grid-template-columns:auto minmax(0,1fr)}.svc .tags{grid-column:1/-1;justify-content:flex-start}}

/* Apps */
.apps{padding-top:clamp(96px,12vw,160px)}
.apps-head{display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-4);flex-wrap:wrap}
.apps-head p{max-width:46ch;margin-top:var(--space-4);font-size:16px;line-height:25px}
.apps-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-12) var(--space-4);margin-top:var(--space-8)}
@media (max-width:760px){.apps-grid{grid-template-columns:minmax(0,1fr)}}
.app{display:flex;flex-direction:column;gap:var(--space-4);min-width:0}
.app.featured{grid-column:1/-1}
.app .media{position:relative;aspect-ratio:16/11;border-radius:var(--shape-xxl);overflow:hidden;display:flex;justify-content:center;align-items:flex-start;transition:border-radius 400ms var(--spring)}
.app.featured .media{aspect-ratio:2/1}
@media (max-width:760px){.app.featured .media{aspect-ratio:1/1}.app.featured .shots{gap:var(--space-2);padding-top:8%}}
.app:hover .media{border-radius:var(--shape-xl)}
.shots{position:relative;display:flex;justify-content:center;align-items:flex-start;width:100%;padding-top:9%;transition:transform 450ms var(--spring)}
.app:hover .shots{transform:translateY(-3%)}
.shots img{display:block;width:31%;height:auto;border-radius:clamp(12px,2vw,22px);box-shadow:var(--elevation-3);background:var(--surface-container);flex:none}
.shots img:nth-child(1){transform:translate(18%,10%) rotate(-6deg)}
.shots img:nth-child(2){position:relative;z-index:1}
.shots img:nth-child(3){transform:translate(-18%,10%) rotate(6deg)}
.app.featured .shots{gap:var(--space-3);padding-top:6%}
.app.featured .shots img{width:min(16.5%,180px);transform:none}
.app.featured .shots img:nth-child(odd){transform:translateY(12%)}
@media (max-width:760px){.app.featured .shots img{width:30%}.app.featured .shots img:nth-child(n+4){display:none}}
.app-meta{display:flex;align-items:center;gap:var(--space-3);padding-inline:var(--space-1)}

/* Page change, home ⇄ all apps. View Transitions: the five home app cards and the "Apps" title morph
   into place on the other page while the rest of the page sinks away and the new one rises in. */
.nav{view-transition-name:nav}
.top-blur{view-transition-name:top-blur}
.apps .sec-title,.all-apps .sec-title{view-transition-name:apps-title;width:fit-content}
::view-transition-group(*){animation-duration:620ms;animation-timing-function:cubic-bezier(.2,.9,.1,1)}
::view-transition-group(nav),::view-transition-group(top-blur){animation:none}
::view-transition-old(root){animation:vt-sink 380ms cubic-bezier(.4,0,1,1) both}
::view-transition-new(root){animation:vt-rise 620ms cubic-bezier(.2,.9,.1,1) 80ms both}
html[data-nav=back]::view-transition-old(root){animation:vt-drop 380ms cubic-bezier(.4,0,1,1) both}
html[data-nav=back]::view-transition-new(root){animation:vt-grow 620ms cubic-bezier(.2,.9,.1,1) 80ms both}
::view-transition-old(apps-title),::view-transition-new(apps-title){height:100%;width:auto;object-fit:contain;object-position:left top}
::view-transition-old(apps-title){animation:vt-fade-out 220ms var(--ease) both}
::view-transition-new(apps-title){animation:vt-fade-in 360ms var(--ease) 120ms both}
@keyframes vt-sink{to{opacity:0;transform:scale(.94) translateY(-24px);filter:blur(6px)}}
@keyframes vt-rise{from{opacity:0;transform:translateY(72px)}}
@keyframes vt-drop{to{opacity:0;transform:translateY(72px)}}
@keyframes vt-grow{from{opacity:0;transform:scale(.94) translateY(-24px);filter:blur(6px)}}
@keyframes vt-fade-out{to{opacity:0}}
@keyframes vt-fade-in{from{opacity:0}}
/* Browsers without View Transitions: the incoming page still rises in. */
@supports not (view-transition-name:a){
  main[data-enter=fwd]{animation:vt-rise 620ms cubic-bezier(.2,.9,.1,1) both}
  main[data-enter=back]{animation:vt-grow 620ms cubic-bezier(.2,.9,.1,1) both}
}
@media (prefers-reduced-motion:reduce){
  ::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}
  main[data-enter]{animation:none!important}
}

/* Talks: accordion stage. One talk open in its tone, the rest collapse to dark vertical spines; hover or focus springs one open. */

.t-secondary-container{--bg:var(--secondary-container);--fg:var(--on-secondary-container);--acc:var(--secondary)}

.acc-card .bigshape path{fill:var(--acc)}

@media (max-width:760px){
  .acc{flex-direction:column;height:auto}
  .acc-card{flex:none;height:88px;transition:height 550ms var(--spring),background-color 400ms var(--ease),color 400ms var(--ease),border-radius 400ms var(--spring)}
  .acc-card.on{height:360px}
  .acc-card .rail{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:var(--space-4);inset:0 var(--space-6)}
  .acc-card .rail b{writing-mode:horizontal-tb;transform:none;font-size:19px;white-space:normal}

}

  /* M3 Expressive shape library as polar radius functions, so any two shapes can be blended point by point. */
  const SHAPES = {
    circle: () => 1,
    cookie4: t => 1 + 0.08 * Math.cos(4 * t),
    cookie6: t => 1 + 0.12 * Math.cos(6 * t),
    cookie9: t => 1 + 0.075 * Math.cos(9 * t),
    cookie12: t => 1 + 0.05 * Math.cos(12 * t),

    flower8: t => 1 + 0.17 * Math.cos(8 * t),

  /* Normalised radii for a shape, sampled once, so blends and live morphs are just array lerps. */

  /* Keeps a path rotating and morphing through seq: hold, then blend into the next shape.
     When seq changes (a button toggles) it blends from wherever it is to the new first shape, with an optional springy turn. */
  function useLiveShape(pathRef, seq, { speed = 18, hold = 1600, morph = 1000, snap = 460, kick = 0 } = {}) {
    const st = useRef(null);
    const opts = useRef(null); opts.current = { speed, hold, morph };
    const key = seq.join('|');
    if (!st.current) {
      const r = radii(seq[0]);
      st.current = { seq, idx: 0, cur: r.slice(), from: r, to: r, phase: 'hold', dur: morph, t0: 0, ang: (liveSeed++ * 47) % 360, last: 0, kick: 0, k0: 0, dirty: true };
    }

      const el = pathRef.current; if (!el) return;
      const s = st.current;
      if (reduced()) { el.setAttribute('d', pathOf(radii(seq[0]))); return; }

      const tick = now => {
        const o = opts.current, dt = s.last ? Math.min(64, now - s.last) : 0; s.last = now;
        s.ang = (s.ang + o.speed * dt / 1000) % 360;
        if (s.phase === 'hold' && now - s.t0 >= o.hold && s.seq.length > 1) {
          s.idx = (s.idx + 1) % s.seq.length; s.from = s.cur.slice(); s.to = radii(s.seq[s.idx]); s.phase = 'morph'; s.dur = o.morph; s.t0 = now;

          s.dirty = true;
        }
        if (s.dirty) { el.setAttribute('d', pathOf(s.cur)); s.dirty = false; }
        let extra = 0;
        if (s.kick) { const p = Math.min(1, (now - s.k0) / 620); extra = s.kick * backOut(p); if (p >= 1) { s.ang = (s.ang + s.kick) % 360; s.kick = 0; extra = 0; } }
        el.setAttribute('transform', 'rotate(' + (s.ang + extra).toFixed(2) + ')');
      };
      s.tick = tick;
      const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { s.last = 0; liveAdd(tick); } else LIVE.delete(tick); });
      io.observe(el.ownerSVGElement);
      return () => { LIVE.delete(tick); io.disconnect(); };
    }, []);
    const first = useRef(true);
    useEffect(() => {
      if (first.current) { first.current = false; return; }
      const el = pathRef.current, s = st.current; if (!el) return;
      s.seq = seq; s.idx = 0;
      if (reduced()) { s.cur = radii(seq[0]).slice(); el.setAttribute('d', pathOf(s.cur)); return; }
      const now = performance.now();
      if (s.kick) s.ang = (s.ang + s.kick) % 360;
      s.from = s.cur.slice(); s.to = radii(seq[0]); s.phase = 'morph'; s.dur = snap; s.t0 = now;
      s.kick = kick; s.k0 = now;
      if (s.tick) liveAdd(s.tick);
    }, [key]);
  }

  /* Caps how far the O stretches so the line, squeezed to 64%, never outgrows the heading: up to 2.2em. */
  const PILL_MAX = 2.2, PILL_MIN = 0.78;
  function fitPill(sw) {
    const box = sw.closest('h1'); if (!box) return;
    const probe = sw.cloneNode(true);
    probe.style.cssText = 'position:absolute;visibility:hidden;left:0;top:0;animation:none;font-stretch:64%';
    const o = probe.querySelector('.glyph-o'); if (o) o.style.cssText = 'animation:none;width:0;border:0;margin:0';
    box.appendChild(probe);
    const text = probe.getBoundingClientRect().width; probe.remove();
    const fs = parseFloat(getComputedStyle(box).fontSize) || 1;
    const room = (box.clientWidth * 0.97 - text) / fs - 0.02; // keep a little air at the edges
    sw.style.setProperty('--pill', Math.max(PILL_MIN, Math.min(PILL_MAX, room)).toFixed(3) + 'em');
  }

  /* A word whose first O is drawn as a shape (see .glyph-o). Text either side stays one run so kerning holds. */
  function ShapeWord({ word, delay = '0s' }) {
    const ref = useRef(null);
    const i = word.toUpperCase().indexOf('O');
    useEffect(() => {
      const sw = ref.current, box = sw && sw.closest('h1'); if (!box) return;
      const fit = () => fitPill(sw);
      fit(); document.fonts && document.fonts.ready.then(fit);
      const ro = new ResizeObserver(fit); ro.observe(box);
      return () => ro.disconnect();
    }, [word]);
    return html`<span class="sw" ref=${ref} style=${{ '--d': delay }}>${word.slice(0, i)}<span class="glyph-o"></span>${word.slice(i + 1)}</span>`;
  }

  /* A bare living svg, for buttons that style their own svg. */
  function ShapeSvg({ seq, view = 1.1, fill, className, ...o }) {
    const ref = useRef(null);
    useLiveShape(ref, seq, o);
    return html`<svg class=${className} viewBox=${-view + ' ' + -view + ' ' + 2 * view + ' ' + 2 * view} aria-hidden="true"><path ref=${ref} style=${fill ? { fill } : undefined} d=${pathOf(radii(seq[0]))} /></svg>`;
  }

  /* Free-floating decorative shape. */
  function MorphShape({ className, ...o }) {
    return html`<span class=${'morph ' + (className || '')} aria-hidden="true"><${ShapeSvg} ...${o} /></span>`;
  }

  /* Living drop-in for the kit's ShapeAvatar: same tones and icon, but it keeps turning and morphing. The icon stays upright. */
  function LiveShape({ shape = 'cookie9', seq, tone = 'primary-container', icon, size = 40, className, speed, hold, morph }) {
    const s = seq || FAMILY[shape] || [shape];
    const dir = useRef(liveSeed % 2 ? -1 : 1).current;
    return html`<span class=${'ex-shape t-' + tone + (className ? ' ' + className : '')} style=${{ width: size, height: size }} aria-hidden="true">
      <${ShapeSvg} seq=${s} view=${1} speed=${speed != null ? speed : dir * 16} hold=${hold || 1700} morph=${morph || 1100} />
      ${icon && html`<span class="ex-shape-c"><span class="ex-icon is-filled" style=${{ fontSize: Math.round(size * 0.5) }} aria-hidden="true">${icon}</span></span>`}
    </span>`;
  }

  /* Shows the progressive top blur once the page has scrolled. */
  function TopBlur() {
    const [on, setOn] = useState(false);
    useEffect(() => {
      const f = () => setOn(scrollY > 8);
      f(); addEventListener('scroll', f, { passive: true });
      return () => removeEventListener('scroll', f);
    }, []);
    return html`<div class=${'top-blur' + (on ? ' on' : '')} aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>`;
  }

  function Nav() {
    const [open, setOpen] = useState(false);
    const panelRef = useRef(null), btnRef = useRef(null), navRef = useRef(null);
    const [panelH, setPanelH] = useState(0);
    useEffect(() => {
      const measure = () => panelRef.current && setPanelH(panelRef.current.scrollHeight);
      measure(); addEventListener('resize', measure);
      return () => removeEventListener('resize', measure);
    }, []);
    useEffect(() => {
      const k = e => { if (e.key === 'Escape' && open) { setOpen(false); btnRef.current && btnRef.current.focus(); } };
      addEventListener('keydown', k); return () => removeEventListener('keydown', k);
    }, [open]);
    const links = [['Apps', '#apps'], ['Services', '#services'], ['Talks', '#talks'], ['Blogs', '#blogs'], ['Contact', '#contact']];
    const close = () => setOpen(false);
    return html`<${React.Fragment}>
      <div class=${'nav-scrim' + (open ? ' on' : '')} onClick=${close}></div>
      <header ref=${navRef} class=${'nav' + (open ? ' open' : '')} style=${{ height: open ? 60 + panelH + 'px' : '60px' }}>
        <div class="nav-row">
          <a class="nav-name" href="#top" onClick=${close}>${NAME}</a>
          <button ref=${btnRef} type="button" class="menu-btn" aria-expanded=${open} aria-controls="nav-panel" aria-label=${open ? 'Close menu' : 'Open menu'} onClick=${() => setOpen(!open)}>
            <${ShapeSvg} view=${1.15} seq=${open ? ['cookie9', 'flower8'] : ['cookie4', 'cookie6', 'clover4']} speed=${open ? 40 : 14} hold=${1500} morph=${800} kick=${open ? 90 : -90} />
            <span class="ex-icon i-more" aria-hidden="true">more_horiz</span>
            <span class="ex-icon i-close" aria-hidden="true">close</span>
          </button>
        </div>
        <div class="nav-panel" id="nav-panel" ref=${panelRef} inert=${open ? undefined : ''}>
          <nav aria-label="Sections">
            ${links.map(([l, h], i) => html`<a key=${h} class="lnk rv" style=${{ '--i': i }} href=${h} onClick=${close}>
              <span><span class="num">0${i + 1}</span>${l}</span>
              <span class="go"><${ShapeSvg} seq=${['cookie6', 'flower5', 'cookie9']} speed=${30} hold=${900} morph=${700} /><span class="ex-icon" aria-hidden="true">arrow_outward</span></span>
            </a>`)}
          </nav>
          <div class="nav-foot rv" style=${{ '--i': links.length }}>
            <span class="status"><i aria-hidden="true"></i>Available for work</span>
            <a href="#contact" onClick=${close}>Say hello<span class="ex-icon" style=${{ fontSize: '18px' }} aria-hidden="true">waving_hand</span></a>
          </div>
        </div>
      </header>
    <//>`;
  }

  function Statement() {
    const ref = useRef(null);
    const words = STATEMENT.split(' ').map(w => ({ acc: w.startsWith('*'), t: w.replace(/\*/g, '') }));
    const [lit, setLit] = useState(words.length);
    useEffect(() => {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      let raf = 0;
      const calc = () => {
        raf = 0; const el = ref.current; if (!el) return;
        const r = el.getBoundingClientRect(), vh = innerHeight;
        const p = Math.min(1, Math.max(0, (vh * 0.85 - r.top) / (r.height + vh * 0.35)));
        setLit(Math.max(1, Math.round(p * words.length)));
      };
      const on = () => { if (!raf) raf = requestAnimationFrame(calc); };
      calc(); addEventListener('scroll', on, { passive: true }); addEventListener('resize', on);
      return () => { removeEventListener('scroll', on); removeEventListener('resize', on); };
    }, []);
    return html`<section class="statement wrap" aria-label="Statement"><p ref=${ref}><span class="sr-only">${STATEMENT.replace(/\*/g, '')}</span>
      ${words.map((w, i) => html`<span key=${i} aria-hidden="true" class=${'w' + (w.acc ? ' hl' : '') + (i < lit ? ' on' : '')}>${w.t}${' '}</span>`)}
    </p></section>`;
  }

  function AppCard({ a }) {
    return html`<article class=${'app' + (a.featured ? ' featured' : '')} aria-labelledby=${'app-' + a.id} style=${{ viewTransitionName: 'app-' + a.id }}>
              <div class="media" style=${{ background: a.bg }}>
                <div class="shots">${a.shots.map((alt, i) => html`<img key=${i} src=${'assets/apps/' + a.id + '-' + (i + 1) + '.webp'} srcset=${'assets/apps/' + a.id + '-' + (i + 1) + '-270.webp 270w, assets/apps/' + a.id + '-' + (i + 1) + '.webp 540w'} sizes="(max-width: 760px) 31vw, 180px" alt=${a.name + ': ' + alt} width="540" height=${a.id === 'launcher' ? 1212 : 960} loading="lazy" decoding="async" />`)}</div>
              </div>
              <div class="app-meta">
                <img class="icon" src=${'assets/apps/' + a.id + '-icon.webp'} alt="" width="56" height="56" loading="lazy" />
                <div class="name"><h3 id=${'app-' + a.id}>${a.name}</h3><div class="store muted">${a.store}</div></div>
              </div>
              <p class="desc muted">${a.desc}</p>
              <div class="tags">${a.status && html`<span class=${'chip ' + a.status}>${a.status === 'live' ? 'On Google Play' : 'In development'}</span>`}${a.tags.map(t => html`<span key=${t}>${t}</span>`)}</div>
              ${a.links && html`<div class="links">${a.links.map(([l, h]) => html`<a key=${h} class="link-arrow" href=${h} target="_blank" rel="noopener" aria-label=${l + ' (' + a.name + ')'}>${l}<span class="ex-icon" aria-hidden="true">arrow_outward</span></a>`)}</div>`}
            </article>`;
  }

  function AllApps({ enter }) {
    return html`<main id="top" class="all-apps wrap" data-enter=${enter}>
      <a class="link-arrow back" href="#apps"><span class="ex-icon" aria-hidden="true">arrow_back</span>Back to home</a>
      <div class="apps-head">
        <div>
          <h1 class="sec-title">All<br/>Apps</h1>
          <p class="muted">All ${APPS.length} Android apps I've designed and built in Kotlin and Jetpack Compose. Screenshots are the apps' own store screens.</p>
        </div>
        <a class="link-arrow" href=${LINKS.play} target="_blank" rel="noopener">Google Play profile<span class="ex-icon">arrow_outward</span></a>
      </div>
      <div class="apps-grid">${APPS.map(a => html`<${AppCard} key=${a.id} a=${a} />`)}</div>
      <div class="apps-end">
        <p class="muted">Install them, read the reviews and get updates on Google Play.</p>
        <a class="link-arrow" href=${LINKS.play} target="_blank" rel="noopener">See all on Google Play<span class="ex-icon">arrow_outward</span></a>
      </div>
    </main>`;
  }

  const ALL_APPS = '#all-apps';
  const BASE_TITLE = document.title;

  const NEEDS = [['Android app', 'android'], ['Redesign', 'auto_awesome'], ['Design system', 'category'], ['Icons', 'interests'], ['Talk or workshop', 'mic']];

  function Contact({ setMsg }) {
    const [copied, setCopied] = useState(false);
    const [need, setNeed] = useState([]);
    useEffect(() => { if (!copied) return; const t = setTimeout(() => setCopied(false), 2200); return () => clearTimeout(t); }, [copied]);
    const copy = () => {
      const fail = () => setMsg('Copy blocked here. Select the address instead.');
      try { navigator.clipboard.writeText(EMAIL).then(() => { setCopied(true); setMsg('Email address copied'); }, fail); } catch (e) { fail(); }
    };
    const toggle = t => setNeed(n => n.includes(t) ? n.filter(x => x !== t) : [...n, t]);
    const submit = e => { e.preventDefault(); setMsg('This form is a preview. Connect it to your inbox to receive messages.'); };
    return html`<section class="contact wrap" id="contact">
      <div class="left">
        <div>
          <span class="avail"><span class="dot" aria-hidden="true"><span class="ring"><${ShapeSvg} seq=${['sunny', 'cookie12']} speed=${-24} hold=${900} morph=${700} /></span><${ShapeSvg} seq=${['cookie9', 'flower8', 'burst', 'clover4', 'cookie12']} fill="var(--positive)" speed=${48} hold=${800} morph=${650} /><span class="ex-icon">bolt</span></span><span><b>Available</b> for new projects</span></span>
          <h2 class="talk-title">Let's<span class="l2"><span class="em">talk.</span><span class="badge" aria-hidden="true"><${MorphShape} seq=${['cookie9', 'flower8', 'burst', 'clover4', 'cookie12']} fill="var(--highlight)" speed=${18} hold=${1200} /><span class="ex-icon">waving_hand</span></span></span></h2>
          <p class="lede">Have an app idea or a design that needs to feel more <b>alive</b>? Tell me about it and I'll reply <b>within two days</b>.</p>
          <div class="mail">
            <span class="eyebrow">Or write directly</span>
            <div class="mail-big">
              <a href=${'mailto:' + EMAIL}>${EMAIL}</a>
              <button type="button" class=${'copy-btn' + (copied ? ' done' : '')} onClick=${copy} aria-label=${copied ? 'Email address copied' : 'Copy email address'} title="Copy email address">
                <${ShapeSvg} seq=${copied ? ['flower5', 'burst'] : ['cookie9', 'cookie12', 'sunny']} speed=${copied ? 60 : -16} hold=${copied ? 700 : 1600} morph=${800} kick=${copied ? 120 : -120} />
                <span class="ex-icon" aria-hidden="true">${copied ? 'check' : 'content_copy'}</span>
              </button>
            </div>
          </div>
        </div>
        <div class="socials-wrap">
          <span class="eyebrow">Find me elsewhere</span>
          <div class="socials">
            ${SOCIALS.map(l => html`<a key=${l.label} class="soc" href=${l.href} target="_blank" rel="noopener" aria-label=${l.label}><span class="ex-icon" aria-hidden="true">${l.icon}</span><span class="tip" aria-hidden="true">${l.label}</span></a>`)}
          </div>
        </div>
      </div>
      <form class="form-card" onSubmit=${submit}>
        <${MorphShape} className="corner" seq=${['flower8', 'cookie6', 'sunny', 'burst']} fill="var(--inverse-primary)" speed=${-14} hold=${1600} />
        <${MorphShape} className="corner2" seq=${['clover4', 'pebble', 'cookie4']} fill="var(--highlight)" speed=${20} hold=${1400} />
        <div class="top"><span class="step">New project</span></div>
        <h3>Tell me about your <span class="em">app.</span></h3>
        <div class="row2">
          <${E.TextField} id="c-name" variant="filled" label="Name" placeholder="Your name" />
          <${E.TextField} id="c-email" variant="filled" label="Email" placeholder="you@example.com" inputMode="email" />
        </div>
        <${E.TextField} id="c-project" variant="filled" label="Your project" multiline=${true} placeholder="What are you building, and where are you stuck?" />
        <fieldset class="need">
          <legend>What do you need?</legend>
          <div class="opts">${NEEDS.map(([t, i]) => html`<button key=${t} type="button" aria-pressed=${need.includes(t)} onClick=${() => toggle(t)}><span class="ex-icon" aria-hidden="true">${need.includes(t) ? 'check' : i}</span>${t}</button>`)}</div>
        </fieldset>
        <button type="submit" class="send">Send message<span class="go" aria-hidden="true"><span class="ex-icon">arrow_forward</span></span></button>
        <p class="fine-print">No newsletters, no spam. Just a reply from me.</p>
      </form>
    </section>`;
  }

  function App() {
    const [route, setRoute] = useState(() => location.hash === ALL_APPS ? 'all' : 'home');
    const [enter, setEnter] = useState(null);
    const routeRef = useRef(route);
    useEffect(() => {
      const on = () => {
        const next = location.hash === ALL_APPS ? 'all' : 'home';
        if (next === routeRef.current) return;
        routeRef.current = next;
        const dir = next === 'all' ? 'fwd' : 'back';
        // Render the other page synchronously, then start the apps page at the top or, going home, land on the section in the URL.
        const swap = () => {
          ReactDOM.flushSync(() => { setRoute(next); setEnter(dir); });
          const el = next === 'home' && location.hash && document.getElementById(location.hash.slice(1));
          el ? el.scrollIntoView({ behavior: 'instant' }) : scrollTo({ top: 0, behavior: 'instant' });
        };
        if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return swap();
        const root = document.documentElement;
        root.dataset.nav = dir;
        document.startViewTransition(swap).finished.finally(() => { if (root.dataset.nav === dir) delete root.dataset.nav; });
      };
      addEventListener('hashchange', on); return () => removeEventListener('hashchange', on);
    }, []);
    useEffect(() => { document.title = route === 'all' ? 'All apps · ' + BASE_TITLE : BASE_TITLE; }, [route]);
    const [msg, setMsg] = useState(null);
    useEffect(() => { if (!msg) return; const t = setTimeout(() => setMsg(null), 3400); return () => clearTimeout(t); }, [msg]);

    return html`<${React.Fragment}>
      <${TopBlur} />
      <${Nav} />
      ${route === 'all' ? html`<${AllApps} enter=${enter} />` : html`<main id="top" data-enter=${enter}>
        <section class="hero wrap">
          <h1><span class="sr-only">Android Developer</span><span class="l1" aria-hidden="true"><${ShapeWord} word="Android" /></span><span class="l2" aria-hidden="true"><${ShapeWord} word="Developer" delay="-6.4s" /></span>
            <${MorphShape} className="float f1" seq=${['sunny', 'cookie9', 'flower8', 'clover4', 'cookie12']} fill="var(--highlight)" speed=${22} />
            <${MorphShape} className="float f2" seq=${['burst', 'cookie6', 'flower5', 'pebble', 'cookie4']} fill="var(--primary)" speed=${-30} hold=${1200} />
          </h1>
          <div class="hero-base">
            <div class="year">©2026</div>
            <figure class="portrait" style=${{ margin: 0 }}>
              <${LiveShape} className="halo" shape="flower8" tone="primary" size=${160} />
              <div class="frame">
                <picture>
                  <source srcset="assets/dinoy-420.webp 420w, assets/dinoy.webp 600w" sizes="210px" type="image/webp" />
                  <img src="assets/dinoy.jpg" width="600" height="684" alt="Portrait of Dinoy" decoding="async" fetchpriority="high" />
                </picture>
                <span class="eyebrow note">Hi, I'm Dinoy</span>
              </div>
              <${LiveShape} className="spark" shape="sunny" tone="highlight" size=${60} />
            </figure>
            <div class="hero-ctas">
              <div class="ex-row">
                <a href="#apps" tabindex="-1"><${E.Button} icon="arrow_downward">See my apps<//></a>
                <a href="#contact" tabindex="-1"><${E.Button} variant="outlined">Hire me<//></a>
              </div>
              <span class="eyebrow muted">/ Shipping calm apps</span>
            </div>
          </div>
        </section>

        <section class="intro wrap" id="about">
          <h2>Hey! <${LiveShape} shape="cookie12" tone="tertiary-container" icon="waving_hand" size=${84} /></h2>
          <div class="intro-grid">
            <p class="lead">I'm ${NAME}, an Android developer who designs the apps <span class="em">before</span> building them.</p>
            <div class="body muted">
              <p>I build focused Android apps in Kotlin and Jetpack Compose: timers, habit trackers, link managers, and blockers for the feeds that eat your evening.</p>
              <p>Every project starts from Expressive Kit, my own Material 3 Expressive design system, so the shapes, colours and motion stay consistent from the first screen to the last.</p>
              <a class="link-arrow" href="#contact" style=${{ alignSelf: 'flex-start', marginTop: '8px' }}>Get started<span class="ex-icon">arrow_outward</span></a>
            </div>
          </div>
        </section>

        <${Statement} />

        <section class="wrap" id="services">
          <h2 class="sec-title">Services</h2>
          <div class="services">
            ${SERVICES.map(s => html`<div class="svc" key=${s.name}>
              <${LiveShape} shape=${s.shape} icon=${s.icon} tone=${s.tone} size=${52} />
              <h3>${s.name}</h3>
              <div class="tags">${s.tags.map(t => html`<span key=${t}>${t}</span>`)}</div>
            </div>`)}
          </div>
        </section>

        <section class="apps wrap" id="apps">
          <div class="apps-head">
            <div>
              <h2 class="sec-title">My<br/>Apps</h2>
              <p class="muted">Android apps I design and build end to end in Kotlin and Jetpack Compose. Screenshots are the apps' own store screens.</p>
            </div>
            <a class="link-arrow" href=${ALL_APPS}>View all apps<span class="ex-icon">arrow_forward</span></a>
          </div>
          <div class="apps-grid">
            ${APPS.slice(0, 5).map(a => html`<${AppCard} key=${a.id} a=${a} />`)}
          </div>
        </section>

        <section class="how wrap" id="talks">
          <div class="how-head">
            <h2 class="sec-title">Talks</h2>
            <a class="link-arrow" href=${LINKS.sessionize} target="_blank" rel="noopener">All talks on Sessionize<span class="ex-icon">arrow_outward</span></a>
          </div>
          <${TalksStage} />
          <div class="events">
            <h3 class="events-title">Where I'm speaking</h3>
            <div class="tix">${EVENTS.map(ev => html`<${EventTicket} key=${ev.name + ev.when} ev=${ev} />`)}</div>
          </div>
        </section>

        <section class="notes wrap" id="blogs">
          <h2 class="sec-title">Blogs</h2>
          <div class="notes-grid">
            <a class="note bg-p" href=${BLOGS[0].href} target="_blank" rel="noopener">
              <div class="art" aria-hidden="true">
                <${LiveShape} shape="cookie9" tone="primary" size=${230} />
                <span class="ex-icon" style=${{ position: 'relative', fontSize: '72px', color: 'var(--on-primary)' }}>android</span>
              </div>
              <div class="txt"><span class="eyebrow muted">${BLOGS[0].eyebrow}</span><h3>${BLOGS[0].title}</h3><p class="muted">${BLOGS[0].blurb}</p></div>
            </a>
            <a class="note bg-s" href=${BLOGS[1].href} target="_blank" rel="noopener">
              <div class="art" aria-hidden="true">
                <${LiveShape} shape="clover4" tone="secondary" size=${160} />
                <${LiveShape} shape="flower5" tone="highlight" size=${90} />
              </div>
              <div class="txt"><span class="eyebrow muted">${BLOGS[1].eyebrow}</span><h3>${BLOGS[1].title}</h3><p class="muted">${BLOGS[1].blurb}</p></div>
            </a>
            <div class="note dark">
              <h3>Writing on Android, Kotlin and Jetpack Compose.</h3>
              <a class="link-arrow" href=${LINKS.medium} target="_blank" rel="noopener">Read all on Medium<span class="ex-icon">arrow_outward</span></a>
            </div>
          </div>
        </section>

        <${Contact} setMsg=${setMsg} />
      </main>`}

      <footer class="footer">
        <div class="wrap">
          <div class="foot-grid">
            <h2>Small apps,<br/><span class="em">finished</span> properly.</h2>
            <div><h3>/ Quick links</h3><div class="foot-links">
              ${[['Home', '#top'], ['About', '#about'], ['Services', '#services'], ['Apps', '#apps'], ['Talks', '#talks'], ['Blogs', '#blogs'], ['Contact', '#contact']].map(([l, h]) => html`<a key=${h} href=${h}>${l}</a>`)}
            </div></div>
            <div><h3>/ Elsewhere</h3><div class="foot-links foot-ext">
              ${[['GitHub', LINKS.github], ['LinkedIn', LINKS.linkedin], ['Medium', LINKS.medium], ['Sessionize', LINKS.sessionize], ['Google Play', LINKS.play], ['All links', LINKS.linktree]].map(([l, h]) => html`<a key=${l} href=${h} target="_blank" rel="noopener">${l}</a>`)}
            </div></div>
            <div><h3>/ Contact</h3><div style=${{ fontFamily: 'var(--font-mono)', fontSize: '14px', wordBreak: 'break-all' }}>${EMAIL}</div></div>
          </div>
          <div class="wordmark" aria-hidden="true" data-text=${NAME.toUpperCase()}></div>
        </div>
        <div class="wrap fine"><span>© 2026 ${NAME}</span><a href="https://github.com/dinoy-raj/Material-3-expressive-design-system-skill" target="_blank" rel="noopener">Built with Expressive Kit</a></div>
      </footer>
      ${msg && html`<div class="toast"><${E.Snackbar} message=${msg} action="OK" onAction=${() => setMsg(null)} /></div>`}
    <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>

</body>
</html>
